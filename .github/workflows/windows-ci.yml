name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Notist
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Verify and build Windows Release
        shell: pwsh
        run: ./tool/verify.ps1 -BuildWindowsRelease

      - name: Ensure verification did not rewrite tracked files
        shell: pwsh
        run: git diff --exit-code
