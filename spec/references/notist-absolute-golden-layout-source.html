<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Notist" description="Notist — 本機 Flow 專案的兩欄編輯器基底（側欄＋Stage）" -->
<helmet><script src="./ds-base.js"></script><style>html,body{margin:0;height:100%;overflow:hidden}*{box-sizing:border-box}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--border-subtle);border-radius:4px}::-webkit-scrollbar-track{background:transparent}</style></helmet>
<div data-theme="{{ theme }}" style="display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-primary)">

<div style="position:relative;flex:0 0 auto">
<x-import component-from-global-scope="PlanistDesignSystem_f9f037.PlnAppWindowHeader" title-id="Notist" brand="{{ brandMark }}" platform-controls="windows" actions="{{ headerActions }}" on-window-action="{{ noop }}" hint-size="100%,44px"></x-import>
<div style="position:absolute;top:0;bottom:0;display:flex;align-items:center;pointer-events:none;left:{{ toggleLeft }}">
<span style="pointer-events:auto">
<x-import component-from-global-scope="PlanistDesignSystem_f9f037.PlnIconButton" semantic-label-id="{{ toggleLabel }}" emphasis="quiet" size="{{ 32 }}" on-invoke="{{ toggleSidebar }}" hint-size="32px,32px">{{ toggleIcon }}</x-import>
</span>
</div>
</div>

<div style="flex:1;min-height:0;display:flex;gap:10px;padding:0 10px 10px">

<sc-if value="{{ sidebarOpen }}" hint-placeholder-val="{{ true }}">
<div style="flex:0 0 auto;display:flex">
<x-import component-from-global-scope="PlanistDesignSystem_f9f037.PlnPrimarySidebarFrame" width="{{ sidebarPx }}" banner="{{ sidebarBanner }}" footer="{{ sidebarFooter }}" on-toggle-collapse="{{ noop }}" hint-size="100%,100%">
<div style="display:flex;flex-direction:column;gap:6px;height:100%;min-height:0">
<nav style="flex:0 0 auto;display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ navItems }}" as="n" hint-placeholder-count="3">
<sc-if value="{{ n.selected }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{ n.select }}" aria-current="page" style="display:flex;align-items:center;gap:12px;width:100%;min-width:0;height:36px;padding:0 10px;text-align:left;background:var(--bg-surface-2);border:1px dashed var(--border-default);border-radius:var(--radius-md);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--text-body);cursor:pointer">
<span style="flex:0 0 auto;display:grid;place-items:center;width:20px;height:20px;color:var(--text-primary)">{{ n.icon }}</span>
<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ n.label }}</span>
<sc-if value="{{ n.count }}"><span style="flex:0 0 auto;font-family:var(--font-mono);font-size:var(--text-micro);color:var(--text-secondary)">{{ n.count }}</span></sc-if>
</button>
</sc-if>
<sc-if value="{{ n.unselected }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ n.select }}" style="display:flex;align-items:center;gap:12px;width:100%;min-width:0;height:36px;padding:0 10px;text-align:left;background:transparent;border:1px dashed transparent;border-radius:var(--radius-md);color:var(--text-secondary);font-family:var(--font-sans);font-size:var(--text-body);cursor:pointer" style-hover="border-color:var(--border-subtle);color:var(--text-primary)">
<span style="flex:0 0 auto;display:grid;place-items:center;width:20px;height:20px;color:var(--text-secondary)">{{ n.icon }}</span>
<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ n.label }}</span>
<sc-if value="{{ n.count }}"><span style="flex:0 0 auto;font-family:var(--font-mono);font-size:var(--text-micro);color:var(--text-tertiary)">{{ n.count }}</span></sc-if>
</button>
</sc-if>
</sc-for>
</nav>
<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px">
<button type="button" onClick="{{ togglePinned }}" aria-expanded="{{ pinnedOpen }}" style="flex:0 0 auto;display:flex;align-items:center;gap:6px;width:100%;height:20px;padding:0 12px;background:transparent;border:none;cursor:pointer;text-align:left">
<span style="flex:0 0 auto;display:grid;place-items:center;width:10px;height:10px;color:var(--text-secondary)">{{ pinnedCaret }}</span>
<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:var(--text-micro);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)">釘選</span>
</button>
<sc-if value="{{ pinnedOpen }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="PlanistDesignSystem_f9f037.PlnTree" label-id="釘選" nodes="{{ pinnedNodes }}" selected-id="{{ selectedFlowId }}" on-select="{{ selectFlow }}" hint-size="100%,60px"></x-import>
</sc-if>
<button type="button" onClick="{{ toggleNotes }}" aria-expanded="{{ notesOpen }}" style="flex:0 0 auto;display:flex;align-items:center;gap:6px;width:100%;height:20px;margin-top:8px;padding:0 12px;background:transparent;border:none;cursor:pointer;text-align:left">
<span style="flex:0 0 auto;display:grid;place-items:center;width:10px;height:10px;color:var(--text-secondary)">{{ notesCaret }}</span>
<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:var(--text-micro);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)">筆記</span>
</button>
<sc-if value="{{ notesOpen }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="PlanistDesignSystem_f9f037.PlnTree" label-id="筆記" nodes="{{ flowNodes }}" selected-id="{{ selectedFlowId }}" on-select="{{ selectFlow }}" hint-size="100%,140px"></x-import>
</sc-if>
</div>
</div>
</x-import>
</div>
<div role="separator" aria-orientation="vertical" tabindex="0" onMouseDown="{{ startDrag }}" onPointerDown="{{ startDrag }}" onKeyDown="{{ resizeKey }}" onDoubleClick="{{ resetWidth }}" title="拖動調整側欄寬度，雙擊還原" style="position:relative;z-index:3;flex:0 0 auto;width:10px;margin:0 -10px;align-self:stretch;display:flex;align-items:center;justify-content:center;cursor:col-resize;background:transparent;border-radius:var(--radius-sm);touch-action:none;user-select:none" style-hover="background:var(--border-subtle)" style-focus="outline:2px solid var(--focus-ring);outline-offset:0">
<span style="width:2px;height:28px;border-radius:1px;background:var(--border-subtle)"></span>
</div>
</sc-if>

<div style="flex:1;min-width:0;display:flex">
<x-import component-from-global-scope="PlanistDesignSystem_f9f037.PlnStageFrame" header="{{ stageHeader }}" status-bar="{{ stageStatusBar }}" hint-size="100%,100%">
<div style="height:100%;min-height:0;overflow-y:auto;padding:8px var(--space-4) 40px">
<div style="max-width:720px;display:flex;flex-direction:column;gap:2px">
<x-import component-from-global-scope="PlanistDesignSystem_f9f037.PlanBlockEditor" blocks="{{ blocks }}" renderers="{{ renderers }}" selection="{{ selection }}" state="{{ editorState }}" capabilities="{{ editorCapabilities }}" empty-state="{{ editorEmpty }}" on-activate-block="{{ activateBlock }}" hint-size="100%,400px"></x-import>
</div>
</div>
</x-import>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1382,&quot;height&quot;:864},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;,&quot;ultra&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;外觀&quot;},&quot;saveState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;saved&quot;,&quot;dirty&quot;,&quot;saving&quot;,&quot;failure&quot;],&quot;default&quot;:&quot;saved&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;情境&quot;}}">
const svg=(paths,size)=>React.createElement("svg",{viewBox:"0 0 24 24",width:size||16,height:size||16,fill:"none",stroke:"currentColor",strokeWidth:1.5,strokeLinecap:"round",strokeLinejoin:"round"},paths.map((d,i)=>React.createElement("path",{key:i,d})));
const FOLDER=["M4 7.5A1.5 1.5 0 0 1 5.5 6h3.2l1.6 2h8.2A1.5 1.5 0 0 1 20 9.5v8A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z"];
const PENCIL=["M4 20h4l10-10-4-4L4 16z","M14 6l4 4"];
const GEAR=["M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z","M19 12a7 7 0 0 0-.1-1.2l1.7-1.3-1.7-3-2 .8a7 7 0 0 0-2-1.2L14.5 4h-5l-.4 2.1a7 7 0 0 0-2 1.2l-2-.8-1.7 3L5.1 10.8A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2L3.4 14.5l1.7 3 2-.8a7 7 0 0 0 2 1.2L9.5 20h5l.4-2.1a7 7 0 0 0 2-1.2l2 .8 1.7-3-1.7-1.3c.1-.4.1-.8.1-1.2z"];
const FOLDER_PLUS=["M4 7.5A1.5 1.5 0 0 1 5.5 6h3.2l1.6 2h8.2A1.5 1.5 0 0 1 20 9.5v8A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z","M12 11.5v4M10 13.5h4"];
const JOURNAL=["M7 4h10a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z","M9 4v16","M12 9h4M12 13h4"];
const SPARK=["M12 4l1.6 4.4L18 10l-4.4 1.6L12 16l-1.6-4.4L6 10l4.4-1.6z","M18 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"];
const ASSETS=["M4 8.5A1.5 1.5 0 0 1 5.5 7h13A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z","M7.5 7V5.5A1.5 1.5 0 0 1 9 4h6a1.5 1.5 0 0 1 1.5 1.5V7","M4 12.5h16"];
const NAV=[
 {id:"journals",label:"Journals",icon:JOURNAL,group:"Journals"},
 {id:"ai",label:"Notist AI",icon:SPARK,group:"對話"},
 {id:"assets",label:"資產庫",icon:ASSETS,group:"資產"}];
const MODE_OPTIONS=[
 {id:"read",label:"唯讀",icon:["M2.5 12s3.6-6 9.5-6 9.5 6 9.5 6-3.6 6-9.5 6-9.5-6-9.5-6z","M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"]},
 {id:"edit",label:"編輯",icon:["M3.5 7.5A1.5 1.5 0 0 1 5 6h14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 18H5a1.5 1.5 0 0 1-1.5-1.5z","M6.5 9.5h1M10 9.5h1M13.5 9.5h1M17 9.5h1M6.5 12.5h1M10 12.5h1M13.5 12.5h1M17 12.5h1M8.5 15.5h7"]},
 {id:"ink",label:"手寫",icon:["M5 19c1.5.4 3-.2 4-1.4L19.2 5.9a1.6 1.6 0 0 0-2.4-2.1L6.3 15.6C5.2 16.8 4.8 18 5 19z","M5 19l2.6-1.2"]}];
const FLOWS=[
 {id:"f-asdasd",labelId:"asdasd",kind:"flow",pinned:true,blocks:[{id:"b1",kind:"paragraph",data:{text:"asdasd"}}]},
 {id:"f-untitled",labelId:"未命名 Flow",kind:"flow",blocks:[]}];
class Component extends DCLogic{
  state={section:"journals",selectedFlowId:"f-asdasd",sidebarWidth:268,pinnedOpen:true,notesOpen:true,sidebarOpen:true,editMode:"edit"};
  ns(){return window.PlanistDesignSystem_f9f037||{};}
  clamp(w){return Math.max(200,Math.min(460,Math.round(w)));}
  componentWillUnmount(){this.stopDrag();}
  stopDrag=()=>{
    if(!this._move)return;
    window.removeEventListener("pointermove",this._move);
    window.removeEventListener("mousemove",this._move);
    window.removeEventListener("pointerup",this.stopDrag);
    window.removeEventListener("mouseup",this.stopDrag);
    document.body.style.cursor="";document.body.style.userSelect="";
    this._move=null;
  };
  beginDrag=(e)=>{
    if(this._move)return;
    e.preventDefault();
    const startX=e.clientX,startW=this.state.sidebarWidth;
    document.body.style.cursor="col-resize";document.body.style.userSelect="none";
    this._move=(ev)=>this.setState({sidebarWidth:this.clamp(startW+ev.clientX-startX)});
    window.addEventListener("pointermove",this._move);
    window.addEventListener("mousemove",this._move);
    window.addEventListener("pointerup",this.stopDrag);
    window.addEventListener("mouseup",this.stopDrag);
  };
  renderVals(){
    const N=this.ns();const p=this.props||{};
    const section=this.state.section;
    const selectedFlowId=this.state.selectedFlowId;
    const flow=FLOWS.find((f)=>f.id===selectedFlowId)||FLOWS[0];
    const blocks=flow.blocks;
    const dirty=p.saveState==="dirty";
    return{
      theme:p.theme||"light",
      noop:()=>{},
      sidebarPx:this.state.sidebarWidth,
      sidebarOpen:this.state.sidebarOpen,
      // Live: tracks the dragged sidebar edge, so it cannot be a literal.
      // Button (32px) right-aligned to the sidebar's right edge: sidebar starts
      // at the 10px window padding, so its right edge is 10+width.
      toggleLeft:(this.state.sidebarOpen?this.state.sidebarWidth+10-32-4:86)+"px",
      toggleLabel:this.state.sidebarOpen?"收合側邊面板":"展開側邊面板",
      toggleIcon:svg(this.state.sidebarOpen
        ?["M4 5.5h16v13H4z","M10 5.5v13","M15.5 10.5L13.5 12l2 1.5"]
        :["M4 5.5h16v13H4z","M10 5.5v13","M13.5 10.5l2 1.5-2 1.5"],20),
      toggleSidebar:()=>this.setState((s)=>({sidebarOpen:!s.sidebarOpen})),
      startDrag:this.beginDrag,
      resetWidth:()=>this.setState({sidebarWidth:268}),
      resizeKey:(e)=>{const step=e.shiftKey?32:8;
        if(e.key==="ArrowLeft"){e.preventDefault();this.setState((s)=>({sidebarWidth:this.clamp(s.sidebarWidth-step)}));}
        else if(e.key==="ArrowRight"){e.preventDefault();this.setState((s)=>({sidebarWidth:this.clamp(s.sidebarWidth+step)}));}
        else if(e.key==="Home"){e.preventDefault();this.setState({sidebarWidth:268});}},
      brandMark:React.createElement("span",{style:{display:"grid",placeItems:"center",width:20,height:20,borderRadius:"var(--radius-sm)",background:"var(--text-primary)",color:"var(--bg-app)",fontFamily:"var(--font-mono)",fontSize:12,fontWeight:600}},"N"),
      headerActions:[React.createElement("span",{key:"k",style:{fontFamily:"var(--font-mono)",fontSize:"var(--text-micro)",color:"var(--text-tertiary)",background:"var(--bg-surface-2)",borderRadius:"var(--radius-sm)",padding:"3px 8px",whiteSpace:"nowrap"}},"⌘K")],

      // Same 36px row box as the nav buttons below, single line.
      sidebarBanner:React.createElement("div",{style:{display:"flex",alignItems:"center",gap:12,minWidth:0,height:36,padding:"0 10px",marginBottom:4}},
        React.createElement("span",{style:{flex:"0 0 auto",width:24,height:24,borderRadius:"var(--radius-sm)",background:"var(--bg-surface-2)",display:"grid",placeItems:"center",color:"var(--text-secondary)"}},
          React.createElement(N.PlnIcon,{size:18},svg(FOLDER,18))),
        React.createElement("span",{style:{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontFamily:"var(--font-sans)",fontSize:"var(--text-body)",fontWeight:600,color:"var(--text-primary)"}},"Flows"),
        // PlnAvatar's own fill is --brand-subtle, which vanishes on the light
        // sidebar; give it a real ground so the identity mark reads as a chip.
        React.createElement("span",{style:{flex:"0 0 auto",display:"grid",placeItems:"center",width:24,height:24,borderRadius:"50%",background:"var(--brand)",color:"var(--text-on-brand)",fontFamily:"var(--font-mono)",fontSize:12},title:"Chia-Yu","aria-label":"Chia-Yu"},"C")),
      sidebarFooter:React.createElement(N.PlnStatusIndicator,{statusCode:"success",labelId:"Flow · local",detail:"僅存在於本機，不經同步"}),

      navItems:NAV.map((n)=>({id:n.id,label:n.label,count:n.count||0,
        icon:React.createElement(N.PlnIcon,{size:18},svg(n.icon,18)),
        selected:n.id===section,unselected:n.id!==section,select:()=>this.setState({section:n.id})})),
      section,
      pinnedOpen:this.state.pinnedOpen,notesOpen:this.state.notesOpen,
      togglePinned:()=>this.setState((s)=>({pinnedOpen:!s.pinnedOpen})),
      toggleNotes:()=>this.setState((s)=>({notesOpen:!s.notesOpen})),
      pinnedCaret:svg([this.state.pinnedOpen?"M6 9l6 6 6-6":"M9 6l6 6-6 6"],10),
      notesCaret:svg([this.state.notesOpen?"M6 9l6 6 6-6":"M9 6l6 6-6 6"],10),
      pinnedNodes:FLOWS.filter((f)=>f.pinned).map((f)=>({id:f.id,labelId:f.labelId,
        icon:React.createElement(N.PlnIcon,{size:14},svg(PENCIL,14))})),
      addIcon:svg(FOLDER_PLUS,16),

      flowNodes:FLOWS.filter((f)=>!f.pinned).map((f)=>({id:f.id,labelId:f.labelId,
        icon:React.createElement(N.PlnIcon,{size:14},svg(PENCIL,14))})),
      selectedFlowId,selectFlow:(id)=>this.setState({selectedFlowId:id}),

      stageHeader:React.createElement(N.PlnStageHeader,{
        breadcrumb:[{id:"root",labelId:"Flows"},{id:"kind",labelId:"Flow"}],
        titleId:flow.labelId,projectionLabelId:"FLOW",state:dirty?"dirty":"ready",
        actions:React.createElement("span",{style:{display:"flex",alignItems:"center",gap:8}},
          React.createElement(N.PlnSegmentedChoice,{options:MODE_OPTIONS.map((m)=>({id:m.id,semanticLabelId:m.label,
            icon:React.createElement(N.PlnIcon,{size:16},svg(m.icon,16))})),
            selectedId:this.state.editMode,onChange:(id)=>this.setState({editMode:id})}),
          React.createElement(N.PlnIconButton,{semanticLabelId:"頁面選單",emphasis:"quiet",size:32,onInvoke:()=>{}},
            svg(["M4 7.5h16","M4 12h16","M4 16.5h16"],18)))}),
      stageStatusBar:React.createElement(N.PlnStageStatusBar,{state:"ready",
        items:[{id:"loaded",labelId:"已載入",tone:"success"},{id:"blocks",labelId:"區塊",value:String(blocks.length)}],
        trailing:React.createElement("span",{style:{fontFamily:"var(--font-mono)",fontSize:"var(--text-micro)",color:"var(--text-tertiary)"}},"本機")}),

      blocks,
      renderers:{paragraph:({block})=>React.createElement("p",{style:{margin:0,padding:"2px 0",fontFamily:"var(--font-sans)",fontSize:"var(--text-body)",lineHeight:1.6,color:"var(--text-primary)",textWrap:"pretty"}},block.data.text)},
      selection:{blockIds:blocks.length?[blocks[0].id]:[],anchorBlockId:blocks.length?blocks[0].id:undefined},
      editorState:this.state.editMode==="read"?"readOnly":"ready",
      editorCapabilities:{canEdit:this.state.editMode!=="read",canComment:false,canDelete:this.state.editMode==="edit"},
      editorEmpty:React.createElement(N.PlnEmptyState,{titleId:"這個 Flow 還沒有內容",descriptionId:"直接開始輸入，或按 / 插入區塊。"}),
      activateBlock:()=>{}};
  }
}
</script>
</body>
</html>
